[workspace]
resolver = "3"
members = [
  "host-monitoring-server",
  "protocol",
]

[workspace.package]
version = "0.9.19"
edition = "2024"
rust-version = "1.98"
authors = ["sarmg <isarmg@163.com>"]
license = "Apache-2.0"
repository = "https://github.com/isarmg/host-monitoring-server"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
host-protocol = { path = "protocol" }
sarmg-admin-auth = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "937f543e38ae34c7520672e465c4f9d3f8010e81", version = "=0.8.3" }
sarmg-admin-core = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "937f543e38ae34c7520672e465c4f9d3f8010e81", version = "=0.8.3" }
sarmg-admin-axum = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "937f543e38ae34c7520672e465c4f9d3f8010e81", version = "=0.8.3" }
sarmg-admin-sqlite = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "937f543e38ae34c7520672e465c4f9d3f8010e81", version = "=0.8.3" }
sarmg-contracts = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "937f543e38ae34c7520672e465c4f9d3f8010e81", version = "=0.8.3" }
sarmg-error = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "937f543e38ae34c7520672e465c4f9d3f8010e81", version = "=0.8.3" }
sarmg-fs-safety = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "937f543e38ae34c7520672e465c4f9d3f8010e81", version = "=0.8.3" }
sarmg-secure-http = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "937f543e38ae34c7520672e465c4f9d3f8010e81", version = "=0.8.3" }
sarmg-schema-identity = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "937f543e38ae34c7520672e465c4f9d3f8010e81", version = "=0.8.3" }
sarmg-server-runtime = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "937f543e38ae34c7520672e465c4f9d3f8010e81", version = "=0.8.3" }
sarmg-server-target = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "937f543e38ae34c7520672e465c4f9d3f8010e81", version = "=0.8.3" }
sarmg-sqlite = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "937f543e38ae34c7520672e465c4f9d3f8010e81", version = "=0.8.3" }
sarmg-secret = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "937f543e38ae34c7520672e465c4f9d3f8010e81", version = "=0.8.3" }
sarmg-secret-envelope = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "937f543e38ae34c7520672e465c4f9d3f8010e81", version = "=0.8.3" }
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
