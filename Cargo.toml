[workspace]
resolver = "3"
members = [
  "host-monitoring-server",
  "protocol",
]

[workspace.package]
version = "0.9.25"
edition = "2024"
rust-version = "1.98"
authors = ["sarmg <isarmg@163.com>"]
license = "Apache-2.0"
repository = "https://github.com/isarmg/host-monitoring-server"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
host-protocol = { path = "protocol" }
sarmg-admin-auth = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "2908f7598571a47c1469bfa08a08c4776cc93049", version = "=0.8.9" }
sarmg-admin-core = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "2908f7598571a47c1469bfa08a08c4776cc93049", version = "=0.8.9" }
sarmg-admin-axum = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "2908f7598571a47c1469bfa08a08c4776cc93049", version = "=0.8.9" }
sarmg-admin-sqlite = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "2908f7598571a47c1469bfa08a08c4776cc93049", version = "=0.8.9" }
sarmg-contracts = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "2908f7598571a47c1469bfa08a08c4776cc93049", version = "=0.8.9" }
sarmg-error = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "2908f7598571a47c1469bfa08a08c4776cc93049", version = "=0.8.9" }
sarmg-fs-safety = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "2908f7598571a47c1469bfa08a08c4776cc93049", version = "=0.8.9" }
sarmg-secure-http = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "2908f7598571a47c1469bfa08a08c4776cc93049", version = "=0.8.9" }
sarmg-schema-identity = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "2908f7598571a47c1469bfa08a08c4776cc93049", version = "=0.8.9" }
sarmg-server-runtime = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "2908f7598571a47c1469bfa08a08c4776cc93049", version = "=0.8.9" }
sarmg-server-target = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "2908f7598571a47c1469bfa08a08c4776cc93049", version = "=0.8.9" }
sarmg-sqlite = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "2908f7598571a47c1469bfa08a08c4776cc93049", version = "=0.8.9" }
sarmg-secret = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "2908f7598571a47c1469bfa08a08c4776cc93049", version = "=0.8.9" }
sarmg-secret-envelope = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "2908f7598571a47c1469bfa08a08c4776cc93049", version = "=0.8.9" }
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
