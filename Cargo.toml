[workspace]
resolver = "3"
members = [
  "crates/server",
  "crates/protocol",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
authors = ["sarmg <isarmg@163.com>"]
license = "Apache-2.0"
repository = "https://github.com/isarmg/xsos"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
anyhow = { version = "1.0.104" }
axum = { version = "0.8.9" }
base64 = { version = "0.23.1" }
chrono = { version = "0.4.45", features = ["clock", "serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = { version = "0.3.34" }
hex = { version = "0.4.3" }
xsos-protocol = { path = "crates/protocol" }
http-body-util = { version = "0.1.5" }
mime = { version = "0.3.17" }
rand = { version = "0.10.3" }
rustix = { version = "1.1.5", features = ["fs", "process", "system"] }
xcss = { git = "https://github.com/isarmg/xcss.git", rev = "9637806055b7d7a18be206f0b83e9b22b73902db", version = "=1.0.0", features = ["tracing"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
sha2 = { version = "0.11.0" }
sqlx = { version = "=0.9.0", default-features = false, features = ["chrono", "json", "macros", "sqlite-bundled", "runtime-tokio", "uuid"] }
tempfile = { version = "3.27.0" }
thiserror = { version = "2.0.21" }
tokio = { version = "1.53.2", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.27.0", features = ["serde", "v4"] }
