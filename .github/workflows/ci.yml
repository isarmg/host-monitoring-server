name: xsos CI

on:
  workflow_call:
    inputs:
      force_full:
        description: Run all validation when this workflow is reused
        type: boolean
        default: true
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTUP_TOOLCHAIN: 1.99.0

jobs:
  # Keep PR workflows and existing check names present; filter jobs, not triggers.
  scope:
    name: Change scope
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_full: ${{ steps.changes.outputs.run_full }}
    steps:
      - name: Check out the comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select documentation or full validation
        id: changes
        shell: bash
        env:
          FORCE_FULL: ${{ inputs.force_full }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          run_full=true
          base=""
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" != tag ]]; then
            base="$PUSH_BASE"
          fi
          # Dispatches, release tags, new branches and unavailable history stay full.
          if [[ "$FORCE_FULL" != true && "$base" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git diff --name-only --no-renames -z "$base" HEAD > "$RUNNER_TEMP/changed-paths"
            run_full=false
            while IFS= read -r -d '' path; do
              case "$path" in
                # Release/package inputs and safety audits retain full validation.
                docs/releases/* | docs/unsafe*.md | docs/server-release-readme.md) run_full=true; break ;;
                README.md | docs/*.md) ;;
                *) run_full=true; break ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi
          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"
          echo "Full validation: $run_full"

  rust-contracts:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.run_full != 'false' }}
    name: Server and protocol (x86_64 GNU/Linux, Rust 1.99)
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Enforce workflow supply-chain policy
        run: python3 scripts/check-workflow-supply-chain.py
      - name: Validate immutable server release tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/package-server-release.py \
            scripts/write-server-release-manifest.py \
            scripts/test-server-release-tooling.py
          python3 scripts/test-server-release-tooling.py
          test "$(grep -Ec '^[[:space:]]*ExecStart[[:space:]]*=' deploy/xsos.service)" -eq 1
          grep -Fx \
            'ExecStart=/opt/isarmg/xsos/current/bin/xsos run --release-root /opt/isarmg/xsos/current' \
            deploy/xsos.service
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - name: Enforce the Server target boundary
        shell: bash
        run: |
          set -euo pipefail
          rustc -vV | grep -Fx 'host: x86_64-unknown-linux-gnu'
          gate_binary="${RUNNER_TEMP}/xsos-build-gate"
          gate_stderr="${RUNNER_TEMP}/xsos-build-gate.stderr"
          rustc scripts/server-target-gate.rs -o "$gate_binary"
          if TARGET=x86_64-pc-windows-msvc "$gate_binary" 2>"$gate_stderr"; then
            echo 'Server build gate accepted an unsupported target.' >&2
            exit 1
          fi
          grep -F \
            'xsos only supports the x86_64-unknown-linux-gnu compilation target' \
            "$gate_stderr"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Assert the authoritative in-repository protocol boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'xsos-protocol = { path = "crates/protocol" }' Cargo.toml
          grep -Fx 'xsos-protocol.workspace = true' crates/server/Cargo.toml
          if grep -RE 'xsos-protocol[[:space:]]*=.*(git|rev|branch|tag)[[:space:]]*=' \
              -- Cargo.toml crates/server/Cargo.toml; then
            echo 'Host components must use the authoritative workspace protocol path.' >&2
            exit 1
          fi
          cargo pkgid --locked -p xsos \
            | grep -F '#xsos@1.0.0'
          cargo pkgid --locked -p xsos-protocol | grep -F '#xsos-protocol@1.0.0'
      - name: Install Node.js for embedded browser assets
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Prepare embedded browser assets
        run: |
          npm --prefix web ci
          web/node_modules/.bin/xcss-build-server --config xcss-web-build.json --mode development --web-only --no-install
      - name: Check Server and protocol
        run: >-
          cargo check --locked --target x86_64-unknown-linux-gnu
          -p xsos -p xsos-protocol --all-targets
      - name: Test Server, protocol, and manifest contracts
        run: >-
          cargo test --locked --target x86_64-unknown-linux-gnu
          -p xsos -p xsos-protocol
      - name: Clippy
        run: >-
          cargo clippy --locked --target x86_64-unknown-linux-gnu
          -p xsos -p xsos-protocol --all-targets -- -D warnings

  frontend-contract:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.run_full != 'false' }}
    name: Dynamic frontend contract
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Build standalone frontend
        working-directory: web
        run: npm run build
      - name: Install browser acceptance engines
        working-directory: web
        run: npx playwright install --with-deps chromium firefox
      - name: Verify current frontend business and accessibility contracts
        working-directory: web
        run: npm run test:browser
