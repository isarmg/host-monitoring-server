name: Host Monitoring CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTUP_TOOLCHAIN: 1.98.0

jobs:
  rust-contracts:
    name: Server and protocol (x86_64 GNU/Linux, Rust 1.98)
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Enforce workflow supply-chain policy
        run: python3 scripts/check-workflow-supply-chain.py
      - name: Validate immutable server release tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/package-server-release.py \
            scripts/write-server-release-manifest.py \
            scripts/test-server-release-tooling.py
          python3 scripts/test-server-release-tooling.py
          mutable_root='/opt/isarmg/host-monitoring/'current
          if git grep -nF "$mutable_root" -- .; then
            echo 'Mutable Host Monitoring server release paths are forbidden.' >&2
            exit 1
          fi
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Enforce the Server target boundary
        shell: bash
        run: |
          set -euo pipefail
          rustc -vV | grep -Fx 'host: x86_64-unknown-linux-gnu'
          gate_binary="${RUNNER_TEMP}/host-monitoring-server-build-gate"
          gate_stderr="${RUNNER_TEMP}/host-monitoring-server-build-gate.stderr"
          rustc host-monitoring-server/build.rs -o "$gate_binary"
          if TARGET=x86_64-pc-windows-msvc "$gate_binary" 2>"$gate_stderr"; then
            echo 'Server build gate accepted an unsupported target.' >&2
            exit 1
          fi
          grep -F \
            'Host Monitoring Server only supports the x86_64-unknown-linux-gnu compilation target' \
            "$gate_stderr"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Assert the authoritative in-repository protocol boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'host-protocol = { path = "protocol" }' Cargo.toml
          grep -Fx 'host-protocol.workspace = true' host-monitoring-server/Cargo.toml
          if grep -RE 'host-protocol[[:space:]]*=.*(git|rev|branch|tag)[[:space:]]*=' \
              -- Cargo.toml host-monitoring-server/Cargo.toml; then
            echo 'Host components must use the authoritative workspace protocol path.' >&2
            exit 1
          fi
          cargo pkgid --locked -p host-monitoring-server \
            | grep -F '#0.9.22'
          cargo pkgid --locked -p host-protocol | grep -F '#host-protocol@0.9.22'
      - name: Check Server and protocol
        run: >-
          cargo check --locked --target x86_64-unknown-linux-gnu
          -p host-monitoring-server -p host-protocol --all-targets
      - name: Test Server, protocol, and manifest contracts
        run: >-
          cargo test --locked --target x86_64-unknown-linux-gnu
          -p host-monitoring-server -p host-protocol
      - name: Clippy
        run: >-
          cargo clippy --locked --target x86_64-unknown-linux-gnu
          -p host-monitoring-server -p host-protocol --all-targets -- -D warnings

  frontend-contract:
    name: Dynamic frontend contract
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Build standalone frontend
        working-directory: web
        run: npm run build
      - name: Install browser acceptance engines
        working-directory: web
        run: npx playwright install --with-deps chromium firefox
      - name: Verify current frontend business and accessibility contracts
        working-directory: web
        run: npm run test:browser
