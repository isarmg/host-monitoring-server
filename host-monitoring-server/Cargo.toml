[package]
name = "host-monitoring-server"
description = "Independent host monitoring server backed by SQLite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
futures-util = "0.3"
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
http-body-util = "0.1"
mime = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
rand.workspace = true
rustix = { version = "1.1", features = ["fs", "process", "system"] }
sarmg-admin-auth.workspace = true
sarmg-admin-core.workspace = true
sarmg-admin-axum.workspace = true
sarmg-admin-sqlite.workspace = true
sarmg-contracts.workspace = true
sarmg-error.workspace = true
sarmg-schema-identity.workspace = true
sarmg-server-runtime.workspace = true
sarmg-server-target.workspace = true
sarmg-sqlite.workspace = true
sarmg-secret.workspace = true
sarmg-secret-envelope.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
  "chrono",
  "json",
  "macros",
  "sqlite",
  "runtime-tokio",
  "uuid",
] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
host-protocol.workspace = true
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
